name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: pnpm install --frozen-lockfile

      # core build runs `buf generate` itself, but generate here first so the
      # TS packages compile even if the topological order of `-r` changes.
      - run: pnpm gen:proto

      - run: pnpm build