name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      - name: Build .NET analyzer
        run: pnpm build:analyzers

      - name: Restore sample project
        run: dotnet restore samples/basic-api

      - name: Analyze sample project
        run: node apps/cli/dist/bin.js analyze samples/basic-api --strict -o "$RUNNER_TEMP/openapi.yaml"

      - name: Check generated spec
        run: grep -q "/api/pets" "$RUNNER_TEMP/openapi.yaml"
