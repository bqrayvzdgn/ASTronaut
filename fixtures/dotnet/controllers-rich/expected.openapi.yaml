openapi: 3.1.0
info:
  title: ControllersRich
  version: 0.0.0
paths:
  /api/orders:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
      tags:
        - Orders
      summary: List orders for the current customer.
      description: Results are paginated; use page and size.
      operationId: List
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
          description: 1-based page number.
        - name: size
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          description: Items per page (1-100).
      security:
        - bearerAuth: []
    post:
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Bad request
      tags:
        - Orders
      summary: Create a new order.
      operationId: Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderDto"
        required: true
      security:
        - bearerAuth: []
  /api/orders/{id}:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
      tags:
        - Orders
      summary: Fetch a single order.
      operationId: Get
      parameters:
        - name: id
          in: path
          schema:
            type: string
            format: uuid
          required: true
          description: The order identifier.
      security:
        - bearerAuth: []
  /health:
    get:
      responses:
        "200":
          description: OK
      tags:
        - Orders
      summary: Public health check — no auth required.
      operationId: Health
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerEmail:
          type: string
          format: email
        total:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 1000000
        notes:
          type:
            - string
            - "null"
      required:
        - id
        - customerEmail
        - total
    CreateOrderDto:
      type: object
      properties:
        customerEmail:
          type: string
          format: email
          minLength: 3
          maxLength: 120
        total:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 1000000
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        notes:
          type:
            - string
            - "null"
          maxLength: 500
      required:
        - customerEmail
        - total
        - currency
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Orders
