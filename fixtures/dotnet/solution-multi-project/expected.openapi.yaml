openapi: 3.1.0
info:
  title: MultiProject
  version: 0.0.0
paths:
  /api/invoices/{id}:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
      tags:
        - Invoices
      operationId: Get
      parameters:
        - name: id
          in: path
          schema:
            type: integer
            format: int32
          required: true
  /api/orders/{id}:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
      tags:
        - Orders
      operationId: Orders_Get
      parameters:
        - name: id
          in: path
          schema:
            type: integer
            format: int32
          required: true
components:
  schemas:
    Invoice:
      type: object
      properties:
        id:
          type: integer
          format: int32
        customer:
          $ref: "#/components/schemas/Customer"
        amount:
          type: number
          format: decimal
      required:
        - id
        - customer
        - amount
    Customer:
      type: object
      properties:
        id:
          type: integer
          format: int32
        email:
          type: string
      required:
        - id
        - email
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int32
        customer:
          $ref: "#/components/schemas/Customer"
        total:
          type: number
          format: decimal
      required:
        - id
        - customer
        - total
tags:
  - name: Invoices
  - name: Orders
