openapi: 3.1.0
info:
  title: DiagnosticsOpenGeneric
  version: 0.0.0
paths:
  /api/items:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
      tags:
        - Items
      operationId: List
components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
      required:
        - id
        - name
tags:
  - name: Items
