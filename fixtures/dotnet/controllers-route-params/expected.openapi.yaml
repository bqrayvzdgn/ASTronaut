openapi: 3.1.0
info:
  title: ControllersRouteParams
  version: 0.0.0
paths:
  /api/v1/Items/{id}:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
      tags:
        - Items
      operationId: GetById
      parameters:
        - name: id
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
          required: true
  /api/v1/Items/by-uuid/{uuid}:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
      tags:
        - Items
      operationId: GetByUuid
      parameters:
        - name: uuid
          in: path
          schema:
            type: string
            format: uuid
          required: true
  /api/v1/Items/by-slug/{slug}:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
      tags:
        - Items
      operationId: GetBySlug
      parameters:
        - name: slug
          in: path
          schema:
            type: string
            minLength: 3
            maxLength: 40
            pattern: ^[A-Za-z]+$
          required: true
  /api/v1/Items/search:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
      tags:
        - Items
      operationId: Search
      parameters:
        - name: q
          in: query
          schema:
            type:
              - string
              - "null"
        - name: page
          in: query
          schema:
            type: integer
            format: int32
        - name: size
          in: query
          schema:
            type: integer
            format: int32
  /api/v1/Items/traced:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
      tags:
        - Items
      operationId: Traced
      parameters:
        - name: X-Trace-Id
          in: header
          schema:
            type: string
          required: true
components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
      required:
        - id
        - name
tags:
  - name: Items
