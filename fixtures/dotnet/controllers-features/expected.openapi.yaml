openapi: 3.1.0
info:
  title: ControllersFeatures
  version: 0.0.0
paths:
  /api/products:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
      tags:
        - Products
      operationId: List
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
          required: true
        - name: page_size
          in: query
          schema:
            type: integer
            format: int32
          required: true
        - name: search
          in: query
          schema:
            type:
              - string
              - "null"
        - name: X-Tenant-Id
          in: header
          schema:
            type: string
          required: true
  /api/products/{id}:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
      tags:
        - Products
      operationId: Get
      parameters:
        - name: id
          in: path
          schema:
            type: integer
            format: int32
          required: true
        - name: include_archived
          in: query
          schema:
            type: boolean
  /api/products/by-status:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
      tags:
        - Products
      operationId: ByStatus
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - Draft
              - Active
              - Archived
          required: true
  /api/v1.0/Reports:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
      tags:
        - Reports
      operationId: Reports_List
  /api/v2.0/Reports:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
      tags:
        - Reports
      operationId: List_2
  /api/v2.0/Reports/summary:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
      tags:
        - Reports
      operationId: Summary
  /api/shapes/{id}:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shape"
      tags:
        - Shapes
      operationId: Shapes_Get
      parameters:
        - name: id
          in: path
          schema:
            type: string
            format: uuid
          required: true
      security:
        - oauth2: []
  /api/shapes:
    post:
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shape"
      tags:
        - Shapes
      operationId: Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Shape"
        required: true
      security:
        - oauth2: []
components:
  schemas:
    ProductQuery:
      type: object
      properties:
        page:
          type: integer
          format: int32
        page_size:
          type: integer
          format: int32
        search:
          type:
            - string
            - "null"
      required:
        - page
        - page_size
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int32
        sku:
          type: string
          maxLength: 50
        tags:
          type: array
          items:
            type: string
          maxItems: 10
        status:
          type: string
          enum:
            - Draft
            - Active
            - Archived
        price:
          $ref: "#/components/schemas/Money"
        display_name:
          type:
            - string
            - "null"
      required:
        - id
        - sku
        - tags
        - status
        - price
    Money:
      type: object
      properties:
        amount:
          type: number
          format: decimal
        currency:
          type: string
      required:
        - amount
        - currency
    Report:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
      required:
        - id
        - title
    Shape:
      oneOf:
        - $ref: "#/components/schemas/Circle"
        - $ref: "#/components/schemas/Rectangle"
      discriminator:
        propertyName: kind
        mapping:
          circle: "#/components/schemas/Circle"
          rectangle: "#/components/schemas/Rectangle"
    Circle:
      type: object
      properties:
        radius:
          type: number
          format: double
        id:
          type: string
          format: uuid
      required:
        - radius
        - id
    Rectangle:
      type: object
      properties:
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        id:
          type: string
          format: uuid
      required:
        - width
        - height
        - id
  securitySchemes:
    oauth2:
      type: oauth2
      flows: {}
tags:
  - name: Products
  - name: Reports
  - name: Shapes
